name: riskbudget CI

on:
  push:
    branches: ["**"]
    paths:
      - "riskbudget/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/riskbudget-ci.yml"
  pull_request:
    paths:
      - "riskbudget/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/riskbudget-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (core)
        run: mypy

      - name: pytest
        run: pytest --cov=riskbudget --cov-report=term-missing
